# Meilisearch にマスターキーをかける上書き。鍵は secrets/master_key.txt に置く。
services:
  meilisearch:
    secrets:
      - meili_master_key
    command:
      - /bin/sh
      - -c
      # 鍵を読めない・空のときは、鍵なしで動かさずに止める。
      - key="$$(cat /run/secrets/meili_master_key)" && [ -n "$$key" ] && MEILI_MASTER_KEY="$$key" exec /bin/meilisearch
  meilisearch-settings:
    secrets:
      - meili_master_key

secrets:
  meili_master_key:
    file: ./secrets/master_key.txt
