# Codex のグローバル設定。
codex:
  model_reasoning_effort: high
  personality: pragmatic
  web_search: cached
  features:
    hooks: true
    multi_agent: true
    personality: true
    shell_snapshot: true
    unified_exec: true
  windows:
    sandbox: elevated
  tui:
    keymap:
      editor:
        insert_newline:
          - alt-n
          - shift-enter
          - ctrl-j
  mcp_servers:
    project_mcp:
      command: npx
      args:
        - -y
        - super-mcp-router@2.7.7
        - --config
        - '{file:~/.config/mcp/mcp.json}'
