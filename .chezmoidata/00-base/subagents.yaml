agents:
  general-fast:
    description: >
      汎用サブエージェント。単純なタスク向け。
      目的により適合する専用のサブエージェントが他に利用可能な場合は使わない。
    modelProfile: fast
    effort:
      default: medium
      claude: high
      pi: off
    settings:
      claude:
        color: cyan
  general-strong:
    description: >
      汎用サブエージェント。複雑なタスク向け。
      目的により適合する専用のサブエージェントが他に利用可能な場合は使わない。
    modelProfile: strong
    effort:
      default: xhigh
      claude: high
      pi: high
    settings:
      claude:
        color: purple
  requirement-reviewer:
    description: >
      要件契約候補、または固定済み要件契約から派生した仕様・作業契約を独立検査するときに使う。
      一般成果物・コード・文章品質のレビューには使わない。対象そのものへの参照を入力として必要とする。
    modelProfile: strong
    effort:
      default: medium
      claude: high
      pi: high
    settings:
      claude:
        color: purple
      opencode:
        permission:
          edit: deny
          task: deny
modelProfiles:
  fast:
    default: opencode-go/deepseek-v4.1-flash
    claude: sonnet
    codex: gpt-6.1-sol
    opencode: opencode/deepseek-v4.1-flash
    agy: flash
  strong:
    default: opencode-go/deepseek-v4.1-flash
    claude: opus
    codex: gpt-6.1-sol
    opencode: opencode/deepseek-v4.1-flash
    agy: flash
