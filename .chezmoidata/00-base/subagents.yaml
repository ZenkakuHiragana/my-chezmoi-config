agents:
  general-fast:
    description: >
      汎用サブエージェント。単純なタスク向け。
      目的により適合する専用のサブエージェントが他に利用可能な場合は使わない。
    modelProfile: fast
    effort:
      default: low
      claude: high
    settings:
      claude:
        color: cyan
  general-strong:
    description: >
      汎用サブエージェント。複雑なタスク向け。
      目的により適合する専用のサブエージェントが他に利用可能な場合は使わない。
    modelProfile: strong
    effort:
      default: medium
      claude: high
    settings:
      claude:
        color: purple
  requirement-reviewer:
    description: >
      要件契約候補、または固定済み要件契約から派生した仕様・作業契約を独立検査するときに使う。
      一般成果物・コード・文章品質のレビューには使わない。対象そのものへの参照を入力として必要とする。
    modelProfile: strong
    effort:
      default: medium
      claude: high
    settings:
      claude:
        color: purple
      opencode:
        permission:
          edit: deny
          task: deny
  review-audit:
    description: >
      初回レビューの固定済み指摘集合について、親エージェントの裁定と該当する修正候補だけを監査するときに使う。
      新しい欠陥を探す成果物レビューには使わない。監査用入力ファイルを必要とする。
    modelProfile: fast
    effort:
      default: low
      claude: medium
    settings:
      claude:
        color: purple
      opencode:
        permission:
          edit: deny
          task: deny
  reviewer:
    description: >
      成果物のレビューをする時に使う。要件契約の独立検査には使わない。対象そのものへの参照を入力として必要とする。
    modelProfile: strong
    effort:
      default: medium
      claude: high
    settings:
      claude:
        color: cyan
      opencode:
        permission:
          edit: deny
          task: deny
modelProfiles:
  fast:
    default: openai-codex/gpt-5.6-sol
    claude: sonnet
    codex: gpt-5.6-luna
    opencode: openai/gpt-5.6-luna
    agy: flash
  strong:
    default: openai-codex/gpt-5.6-sol
    claude: opus
    codex: gpt-5.6-luna
    opencode: openai/gpt-5.6-luna
    agy: flash
