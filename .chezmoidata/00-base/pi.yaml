# Pi のグローバル設定。共通の MCP は mcp.yaml にある。
pi:
  tool_filter:
    read:
      allow:
        - "~/.local/share/chezmoi/.opencode/local-failure-logs/**"
        - "~/.local/share/chezmoi/.pi/local-failure-logs/**"
      deny:
        - "~/.ssh"
        - "~/.ssh/**"
        - "~/.bashrc"
        - "~/.bash_profile"
        - "~/.profile"
        - "~/.zshrc"
        - "~/.zprofile"
        - "~/.aws"
        - "~/.aws/**"
        - "~/.config/gcloud"
        - "~/.config/gcloud/**"
        - "~/.kube/config"
        - "~/.npmrc"
        - "~/.pypirc"
        - "~/.git-credentials"
        - "~/.netrc"
    write:
      allow:
        - "~/.local/share/chezmoi/.opencode/local-failure-logs/**"
        - "~/.config/opencode/KNOWLEDGE.yml"
        - "~/.config/opencode/KNOWLEDGE.local.yml"
        - "~/.config/opencode/knowledge-instructions/**"
        - "~/AppData/Local/Temp/opencode/**"
        - "~/AppData/Local/Temp/pi/**"
        - "~/research/**"
        - "/tmp/opencode/**"
        - "/tmp/pi/**"
        - "/dev/null"
      deny:
        - ".git"
        - ".git/**"
        - "**/NUL"
      outsideDefault: deny
  settings:
    steeringMode: all
    showHardwareCursor: false
    enableSkillCommands: false
    transport: auto
    markdown:
      mermaid: streaming
    doubleEscapeAction: tree
    treeFilterMode: default
    tuiMode: fullscreen
    fullscreenScrollbar: auto
    hideThinkingBlock: true
    shellCommandPrefix: 'export PATH="$HOME/.pi/agent/scripts:$PATH"'
    defaultTools:
      - bash
    codemode:
      mode: only
    packages:
      - npm:pi-context-view
      - npm:@valdo766hi/pi-fast
      - npm:@foliox/transparent-compact-pi
      - git:github.com/jokerx0001/pi-model-system-prompt
      - git:github.com/johnnyshields/pi-keepalive
      - source: git:github.com/rytswd/pi-agent-extensions
        extensions:
          - "-direnv/index.ts"
          - "-fetch/index.ts"
          - "-notify/index.ts"
          - "-permission-gate/index.ts"
          - "-slow-mode/index.ts"
          - "-statusline/index.ts"
          - "-inbox/index.ts"
          - "-python/index.ts"
    keepalive:
      cache_ttl: 1h
      cache_upkeep: off
