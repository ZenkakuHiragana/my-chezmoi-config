# Pi のグローバル設定。共通の MCP は mcp.yaml にある。
pi:
  tool_filter:
    read:
      allow:
        - ~/.local/share/chezmoi/.opencode/local-failure-logs/**
      deny:
        - ~/.ssh
        - ~/.ssh/**
        - ~/.bashrc
        - ~/.bash_profile
        - ~/.profile
        - ~/.zshrc
        - ~/.zprofile
        - ~/.aws
        - ~/.aws/**
        - ~/.config/gcloud
        - ~/.config/gcloud/**
        - ~/.kube/config
        - ~/.npmrc
        - ~/.pypirc
        - ~/.git-credentials
        - ~/.netrc
    write:
      allow:
        - ~/.local/share/chezmoi/.opencode/local-failure-logs/**
        - ~/.config/opencode/KNOWLEDGE.yml
        - ~/.config/opencode/KNOWLEDGE.local.yml
        - ~/.config/opencode/knowledge-instructions/**
        - ~/AppData/Local/Temp/opencode/**
        - /tmp/opencode/**
        - /dev/null
      deny:
        - .git
        - .git/**
        - '**/NUL'
      outsideDefault: deny
